name: Bug report
description: Report a reproducible problem in Carnelia
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Please provide as much detail as possible.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: Briefly describe the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Provide minimal, deterministic steps.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: crate
    attributes:
      label: Affected area
      options:
        - mdcs-core
        - mdcs-delta
        - mdcs-merkle
        - mdcs-compaction
        - mdcs-db
        - mdcs-sdk
        - mdcs-wasm
        - docs/examples
        - other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / output / screenshots
      description: Paste error output, stack traces, or screenshots.
      render: shell

  - type: input
    id: rust
    attributes:
      label: Rust version
      placeholder: rustc --version

  - type: input
    id: os
    attributes:
      label: OS / environment
      placeholder: e.g., Ubuntu 24.04, macOS 14, Windows 11

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I can reproduce this on current main (or latest release).
          required: true
